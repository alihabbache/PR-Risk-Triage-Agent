name: "PR Risk Triage Agent CI"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test-and-triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Engine Unit Tests & Backtester Benchmark
        run: |
          python3 -m unittest discover tests
          python3 engine/backtester.py

      - name: Evaluate Pull Request Risk
        if: github.event_name == 'pull_request'
        id: triage
        run: |
          python3 engine/cli.py \
            --author "${{ github.event.pull_request.user.login }}" \
            --title "${{ github.event.pull_request.title }}" \
            --output-json triage-result.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Post Triage Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('triage-result.json', 'utf8'));
            const commentBody = data.suggested_bot_comment;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            
            if (data.risk_label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [data.risk_label]
              });
            }
